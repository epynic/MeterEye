; EB-Cam firmware — AI-Thinker ESP32-CAM
; Platform pinned for reproducible builds. Phase 5 switches framework to
; "arduino, espidf" to unlock sdkconfig (OTA rollback, flash encryption).

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2
monitor_filters = esp32_exception_decoder, default
